<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Analytics Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fc;
            color: #222;
        }

        /* ================= HEADER ================= */

        header {
            width: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            width: 90%;
            max-width: 1300px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ffd166;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #ffd166;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 2px;
            background: #ffd166;
            transition: 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ================= HERO SECTION ================= */

        .hero {
            text-align: center;
            padding: 70px 20px 40px;
            background: linear-gradient(to right, #eef3ff, #f8fbff);
        }

        .hero h1 {
            font-size: 42px;
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            max-width: 700px;
            margin: auto;
            line-height: 1.7;
        }

        /* ================= CHART SECTION ================= */

        .dashboard-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .chart-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1e3c72;
            font-size: 24px;
            text-transform: capitalize;
        }

        canvas {
            width: 100% !important;
            height: 320px !important;
        }

        /* ================= FOOTER ================= */

        footer {
            margin-top: 50px;
            background: #1e3c72;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 14px;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <nav class="navbar">
            <div class="logo">Krushi<span>Analytics</span></div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Charts</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ================= HERO ================= -->

    <section class="hero">
        <h1>Business Analytics Dashboard</h1>
        <p>
            Visualize your company revenue, expenses, and profit trends
            with interactive charts powered by Chart.js.
        </p>
    </section>

    <!-- ================= CHARTS ================= -->

    <div class="dashboard-container">

        <div class="chart-grid">

            <div class="chart-card">
                <h2>Line Chart</h2>
                <canvas id="myChart1"></canvas>
            </div>

            <div class="chart-card">
                <h2>Bar Chart</h2>
                <canvas id="myChart2"></canvas>
            </div>

            <div class="chart-card">
                <h2>Pie Chart</h2>
                <canvas id="myChart3"></canvas>
            </div>

        </div>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>
        © 2026 KrushiAnalytics | Business Dashboard UI
    </footer>

    <!-- ✅ Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        const ctx1 = document.getElementById('myChart1');
        const ctx2 = document.getElementById('myChart2');
        const ctx3 = document.getElementById('myChart3');

        const months = ['January', 'February', 'March', 'April', 'May', 'June'];

        const revenue = [50000, 60000, 55000, 70000, 75000, 80000];
        const expenses = [30000, 35000, 32000, 40000, 42000, 45000];
        const profit = [20000, 25000, 23000, 30000, 33000, 35000];

        // ================= LINE CHART =================

        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Revenue',
                    data: revenue,
                    borderColor: 'blue',
                    backgroundColor: 'rgba(0,0,255,0.1)',
                    tension: 0.4,
                    fill: false
                },
                {
                    label: 'Expenses',
                    data: expenses,
                    borderColor: 'red',
                    backgroundColor: 'rgba(255,0,0,0.1)',
                    tension: 0.4,
                    fill: false
                },
                {
                    label: 'Profit',
                    data: profit,
                    borderColor: 'green',
                    backgroundColor: 'rgba(0,128,0,0.1)',
                    tension: 0.4,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 20,
                            font: {
                                size: 14
                            }
                        }
                    }
                }
            }
        });

        // ================= BAR CHART =================

        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Revenue',
                    data: revenue,
                    backgroundColor: '#2a5298',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 20,
                            font: {
                                size: 14
                            }
                        }
                    }
                }
            }
        });

        // ================= PIE CHART =================

        new Chart(ctx3, {
            type: 'pie',
            data: {
                labels: ['Reinvestment 40%', 'Salary 35%', 'Miscellaneous 25%'],
                datasets: [{
                    data: [40, 35, 25],
                    backgroundColor: ['#2a5298', '#ff6b6b', '#2ecc71']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 20,
                            font: {
                                size: 14
                            }
                        }
                    }
                }
            }
        });

    </script>

</body>

</html>
